    justify-content:center;
    padding: 32px 20px;
    background:
      radial-gradient(700px circle at 50% -10%, rgba(203,161,53,0.06), transparent 60%),
      var(--bg);
  }

  .card{
    width:100%;
    max-width: 420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* ---- avatar ---- */
  .avatar-wrap{
    position:relative;
    width:96px;
    height:96px;
    margin-bottom: 20px;
    transition: transform 0.35s cubic-bezier(0.2,0.8,0.2,1);
  }

  .avatar-wrap:hover{
    transform: scale(1.22) rotate(-2deg);
  }

  .avatar-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:1.5px solid var(--ring);
    transition: border-color 0.35s ease, box-shadow 0.35s ease;
  }

  .avatar-wrap:hover .avatar-ring{
    border-color: var(--accent-dim);
    box-shadow: 0 0 22px -4px rgba(203,161,53,0.55);
  }

  .avatar-ring::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1.5px solid var(--accent);
    opacity:0;
    animation: pulse-ring 2.8s ease-out infinite;
  }

  .avatar-wrap:hover .avatar-ring::after{
    animation-duration: 1.4s;
  }

  @keyframes pulse-ring{
    0%   { transform:scale(0.94); opacity:0.7; }
    70%  { transform:scale(1.18); opacity:0; }
    100% { transform:scale(1.18); opacity:0; }
  }

  .avatar{
    width:96px;
    height:96px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background: var(--surface);
    border: 1px solid var(--ring);
    filter: saturate(1) brightness(1);
    transition: filter 0.35s ease;
  }

  .avatar-wrap:hover .avatar{
    filter: saturate(1.15) brightness(1.06);
  }

  .avatar-initials{
    width:96px;
    height:96px;
    border-radius:50%;
    background: var(--surface);
    border: 1px solid var(--ring);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size: 34px;
    color: var(--accent);
  }

  .status-dot{
    position:absolute;
    right:2px;
    bottom:2px;
    width:16px;
    height:16px;
    border-radius:50%;
    border:3px solid var(--bg);
    cursor:pointer;
    display:block;
    transition: transform 0.2s ease;
  }

  .status-dot:hover{
    transform: scale(1.15);
  }

  .status-tooltip{
    position:absolute;
    bottom: 30px;
    right: -10px;
    display:flex;
    align-items:center;
    gap: 6px;
    background: var(--bg-soft);
    border: 1px solid var(--ring);
    color: var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.4px;
    padding: 6px 10px;
    border-radius: 8px;
    white-space: nowrap;
    opacity:0;
    transform: translateY(4px);
    pointer-events:none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    box-shadow: 0 8px 18px -8px rgba(0,0,0,0.55);
    z-index: 5;
  }

  .status-tooltip::before{
    content:"";
    position:absolute;
    bottom:-5px;
    right: 16px;
    width:8px;
    height:8px;
    background: var(--bg-soft);
    border-right:1px solid var(--ring);
    border-bottom:1px solid var(--ring);
    transform: rotate(45deg);
  }

  .status-tooltip .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    flex-shrink:0;
  }

  .status-tooltip.visible{
    opacity:1;
    transform: translateY(0);
  }

  /* ---- identity ---- */
  .name{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.2px;
    color: var(--text);
    margin: 0;
    position:relative;
    display:inline-block;
    transition: text-shadow 0.4s ease;
  }

  .name:hover{
    text-shadow: 0 0 18px rgba(203,161,53,0.35);
  }

  .name-underline{
    width: 0%;
    height: 1px;
    background: var(--accent);
    margin: 8px auto 0;
    animation: draw-line 1.1s 0.3s ease-out forwards;
    transition: width 0.3s ease, box-shadow 0.3s ease;
  }

  .name:hover + .name-underline{
    width: 70px;
    box-shadow: 0 0 8px rgba(203,161,53,0.6);
  }

  @keyframes draw-line{
    to{ width: 46px; }
  }

  .handle{
    margin-top: 12px;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
  }

  .tagline{
    margin-top: 6px;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: var(--accent);
  }

  .bio{
    margin-top: 20px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text-dim);
    max-width: 340px;
  }

  /* ---- divider ---- */
  .divider{
    display:flex;
    align-items:center;
    gap: 10px;
    width:100%;
    max-width: 320px;
    margin: 28px 0 22px;
  }
  .divider .line{ flex:1; height:1px; background: var(--ring); }
  .divider .dot{ width:4px; height:4px; border-radius:50%; background: var(--accent-dim); }

  /* ---- links ---- */
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  @keyframes link-in{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .link-row{
    opacity:0;
    animation: link-in 0.5s ease forwards;
  }

  .link-row{
    position:relative;
    z-index: 1;
    display:flex;
    align-items:center;
    gap: 14px;
    width:100%;
    padding: 14px 18px;
    background: var(--bg-soft);
    border: 1px solid var(--ring);
    border-radius: var(--radius);
    text-decoration:none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    letter-spacing: 0.3px;
    overflow:hidden;
    cursor:pointer;
    transition: border-color 0.25s ease, transform 0.15s ease, background 0.25s ease, box-shadow 0.25s ease;
  }

  .link-row::before{
    content:"";
    position:absolute;
    top:0;
    left:-60%;
    width: 40%;
    height:100%;
    background: linear-gradient(120deg, transparent, rgba(203,161,53,0.14), transparent);
    transform: skewX(-20deg);
    transition: left 0.65s ease;
    pointer-events:none;
  }

  .link-row:hover::before{
    left: 130%;
  }

  .link-row:hover{
    border-color: var(--accent-dim);
    background: var(--surface);
    transform: translateY(-3px) scale(1.08);
    box-shadow: 0 12px 26px -10px rgba(0,0,0,0.55), 0 0 24px -6px rgba(203,161,53,0.35), 0 0 0 1px rgba(203,161,53,0.15);
    z-index: 2;
  }

  .link-row:active{ transform: translateY(0); }

  .link-index{
    color: var(--text-dim);
    font-size: 12px;
    min-width: 20px;
    text-align:left;
    transition: color 0.25s ease;
  }

  .link-row:hover .link-index{
    color: var(--accent);
  }

  .link-label{ flex:1; text-align:left; }

  .link-arrow{
    color: var(--accent);
    opacity:0;
    transform: translateX(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    font-size: 13px;
  }

  .link-row:hover .link-arrow{
    opacity:1;
    transform: translateX(0);
  }

  .link-row:focus-visible{
    outline: 1.5px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---- footer ---- */
  .footer{
    margin-top: 32px;
    font-size: 10.5px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    opacity: 0.6;
  }

  @media (prefers-reduced-motion: reduce){
    .avatar-ring::after,
    .name-underline,
    .link-row{
      animation: none !important;
    }
    .name-underline{ width: 46px; }
    .link-row{ opacity:1; }
  }

  /* ---- account chooser modal ---- */
  .modal-overlay{
    position:fixed;
    inset:0;
    background: rgba(6,7,5,0.72);
    backdrop-filter: blur(2px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    opacity:0;
    pointer-events:none;
    transition: opacity 0.2s ease;
    z-index: 100;
  }

  .modal-overlay.open{
    opacity:1;
    pointer-events:auto;
  }

  .modal-box{
    width:100%;
    max-width: 340px;
    background: var(--bg-soft);
    border: 1px solid var(--ring);
    border-radius: var(--radius);
    padding: 20px;
    transform: translateY(6px);
    transition: transform 0.2s ease;
  }

  .modal-overlay.open .modal-box{
    transform: translateY(0);
  }

  .modal-title{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 17px;
    color: var(--text);
    margin: 0 0 4px;
    text-align:left;
  }

  .modal-subtitle{
    font-size: 11.5px;
    color: var(--text-dim);
    text-align:left;
    margin-bottom: 16px;
    letter-spacing: 0.3px;
  }

  .modal-accounts{
    display:flex;
    flex-direction:column;
    gap: 8px;
  }

  .modal-account{
    display:flex;
    align-items:center;
    gap: 12px;
    padding: 10px;
    background: var(--surface);
    border: 1px solid var(--ring);
    border-radius: 10px;
    text-decoration:none;
    color: var(--text);
    transition: border-color 0.2s ease, transform 0.15s ease;
  }

  .modal-account:hover{
    border-color: var(--accent-dim);
    transform: translateY(-1px);
  }

  .modal-account img{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    object-fit: cover;
    border: 1px solid var(--ring);
    flex-shrink:0;
  }

  .modal-account-name{
    font-size: 13px;
    text-align:left;
  }

  .modal-close{
    display:block;
    margin: 16px auto 0;
    background:none;
    border:none;
    color: var(--text-dim);
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    cursor:pointer;
    padding: 4px 8px;
  }

  .leave-actions{
    display:flex;
    gap: 10px;
    margin-top: 6px;
  }

  .leave-btn{
    flex:1;
    padding: 11px 10px;
    border-radius: 10px;
    font-family:'JetBrains Mono', monospace;
    font-size: 12.5px;
    letter-spacing: 0.3px;
    cursor:pointer;
    transition: transform 0.15s ease, border-color 0.2s ease, background 0.2s ease;
  }

  .leave-btn:active{ transform: translateY(1px); }

  .leave-cancel{
    background: var(--surface);
    border: 1px solid var(--ring);
    color: var(--text);
  }

  .leave-cancel:hover{ border-color: var(--text-dim); }

  .leave-continue{
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #1A1400;
    font-weight: 600;
  }

  .leave-continue:hover{ filter: brightness(1.08); }

  .modal-close:hover{ color: var(--text); }

  /* ---- ambient background: gaming-inspired motifs, kept abstract and low-key ---- */
  .bg-layer{
    position:fixed;
    inset:0;
    z-index:0;
    overflow:hidden;
    pointer-events:none;
  }

  .card{ position:relative; z-index:1; }
  .modal-overlay{ z-index:100; }

  .bg-mountains{
    position:absolute;
    bottom:0;
    left:0;
    width:100%;
    height:26vh;
    min-height:160px;
  }

  .bg-rune{
    position:absolute;
    top:8%;
    right:-40px;
    width:180px;
    height:180px;
    opacity:0.35;
    animation: rune-spin 90s linear infinite;
  }

  @keyframes rune-spin{
    to{ transform: rotate(360deg); }
  }

  /* voxel cubes — nod to blocky sandbox worlds */
  .bg-cube{
    position:absolute;
    width:22px;
    height:22px;
    transform-style: preserve-3d;
    opacity:0.28;
    animation: cube-drift 14s ease-in-out infinite;
  }

  .bg-cube span{
    position:absolute;
    inset:0;
    border: 1px solid var(--accent-dim);
    background: rgba(203,161,53,0.05);
  }

  .bg-cube span:nth-child(2){ transform: translate(4px,-4px); opacity:0.7; }
  .bg-cube span:nth-child(3){ transform: translate(8px,-8px); opacity:0.45; }

  .c1{ top: 14%; left: 8%; animation-delay: 0s; }
  .c2{ top: 62%; left: 85%; width:16px; height:16px; animation-delay: 3s; }
  .c3{ top: 40%; left: 4%; width:14px; height:14px; animation-delay: 6.5s; }

  @keyframes cube-drift{
    0%, 100%{ transform: translateY(0) rotate(0deg); }
    50%{ transform: translateY(-22px) rotate(12deg); }
  }

  /* embers — nod to campfires / drifting spores */
  .ember{
    position:absolute;
    bottom: -10px;
    width: 3px;
    height: 3px;
    border-radius: 50%;
    background: var(--accent);
    opacity:0;
    animation: ember-rise linear infinite;
    box-shadow: 0 0 6px 1px rgba(203,161,53,0.6);
  }

  .e1{ left: 12%; animation-duration: 9s; animation-delay: 0s; }
  .e2{ left: 28%; animation-duration: 12s; animation-delay: 2.5s; }
  .e3{ left: 68%; animation-duration: 10s; animation-delay: 1s; }
  .e4{ left: 82%; animation-duration: 13s; animation-delay: 4s; }
  .e5{ left: 50%; animation-duration: 11s; animation-delay: 6s; }

  @keyframes ember-rise{
    0%{ transform: translateY(0) translateX(0); opacity:0; }
    10%{ opacity:0.7; }
    90%{ opacity:0.3; }
    100%{ transform: translateY(-70vh) translateX(14px); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-rune, .bg-cube, .ember{ animation: none !important; }
    .ember{ opacity:0; }
  }

  @media (max-width: 480px){
    .bg-rune{ width:120px; height:120px; top:4%; right:-30px; }
    .bg-mountains{ height:20vh; min-height:120px; }
    .bg-spotlight{ width:190px; height:190px; margin-left:-95px; margin-top:-95px; }
    .bg-cube{ display:none; }
    .bg-axe{ width:60px; height:110px; }
    .bg-valknut{ width:80px; height:80px; }
  }

  @media (min-width: 900px){
    .bg-spotlight{ width:320px; height:320px; margin-left:-160px; margin-top:-160px; }
  }

  /* ---- Norse / God of War-inspired motifs (original, generic mythology imagery) ---- */
  .bg-valknut{
    position:absolute;
    top:62%;
    left:-30px;
    width:110px;
    height:110px;
    opacity:0.3;
    animation: valknut-breathe 7s ease-in-out infinite;
  }

  @keyframes valknut-breathe{
    0%,100%{ opacity:0.22; transform:scale(1); }
    50%{ opacity:0.36; transform:scale(1.04); }
  }

  .bg-axe{
    position:absolute;
    top:10%;
    left:6%;
    width:80px;
    height:150px;
    opacity:0.22;
    transform: rotate(-14deg);
    animation: axe-sway 10s ease-in-out infinite;
  }

  @keyframes axe-sway{
    0%,100%{ transform: rotate(-14deg); }
    50%{ transform: rotate(-9deg); }
  }

  .bg-raven{
    position:absolute;
    top:22%;
    left:-60px;
    width:46px;
    height:30px;
    opacity:0.3;
    animation: raven-fly 22s linear infinite;
  }

  @keyframes raven-fly{
    0%{ transform: translate(0,0); }
    45%{ transform: translate(60vw, 6vh); }
    100%{ transform: translate(130vw, -4vh); }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-valknut, .bg-axe, .bg-raven{ animation:none !important; }
  }

  /* ---- pointer light: cursor/touch glow + trailing sparks ---- */
  .bg-spotlight{
    position:fixed;
    width:260px;
    height:260px;
    left:0;
    top:0;
    margin-left:-130px;
    margin-top:-130px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(203,161,53,0.13), rgba(203,161,53,0.04) 45%, transparent 72%);
    pointer-events:none;
    z-index:0;
    opacity:0;
    mix-blend-mode: screen;
    transition: left 0.16s ease-out, top 0.16s ease-out, opacity 0.4s ease;
  }

  .bg-spotlight.active{ opacity:1; }

  .trail-spark{
    position:fixed;
    width:5px;
    height:5px;
    border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 10px 2px rgba(203,161,53,0.55);
    pointer-events:none;
    z-index:0;
    opacity:0.75;
    transform: translate(-50%,-50%);
    animation: spark-fade 0.9s ease-out forwards;
  }

  @keyframes spark-fade{
    to{ opacity:0; transform: translate(-50%,-50%) scale(0.25); }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-spotlight{ transition: opacity 0.4s ease; }
    .trail-spark{ display:none; }
  }
  @media (max-width: 360px){
    .name{ font-size: 26px; }
    .avatar-wrap{ width:84px; height:84px; }
    .avatar, .avatar-initials{ width:84px; height:84px; }
  }

</style>
</head>

    <div class="modal-box">
      <p class="modal-title">Leaving this site</p>
      <p class="modal-subtitle" id="leaveSubtitle">you're about to head to an external link</p>
      <div class="leave-actions">
        <button class="leave-btn leave-cancel" id="leaveCancel">Stay here</button>
        <button class="leave-btn leave-continue" id="leaveContinue">Continue</button>
      </div>
    </div>
  </div>

<script>
  const P = window.PROFILE;

  document.title = P.name + " — Links";
  document.getElementById('nameEl').textContent = P.name;
  document.getElementById('handleEl').textContent = P.handle;
  document.getElementById('taglineEl').textContent = P.tagline;
  document.getElementById('bioEl').innerHTML = P.bio
    .split('\n')
    .map(line => line.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'))
    .join('<br>');

  // avatar
  const slot = document.getElementById('avatarSlot');
  if (P.avatar) {
    const img = document.createElement('img');
    img.src = P.avatar;
    img.alt = P.name;
    img.className = 'avatar';
    slot.appendChild(img);
  } else {
    const initials = P.name.trim().split(/\s+/).map(w => w[0]).slice(0,2).join('').toUpperCase();
    const div = document.createElement('div');
    div.className = 'avatar-initials';
    div.textContent = initials;
    slot.appendChild(div);
  }

  // ---- leave-site confirmation, shown before any outbound link/button navigates ----
  const leaveOverlay = document.getElementById('leaveOverlay');
  const leaveSubtitle = document.getElementById('leaveSubtitle');
  const leaveCancel = document.getElementById('leaveCancel');
  const leaveContinue = document.getElementById('leaveContinue');
  let pendingUrl = null;

  function confirmNavigate(url){
    pendingUrl = url;
    let host = url;
    try { host = new URL(url).hostname.replace(/^www\./, ''); } catch (e) {}
    leaveSubtitle.textContent = `you're about to head to ${host}`;
    leaveOverlay.classList.add('open');
  }

  function closeLeaveModal(){
    leaveOverlay.classList.remove('open');
    pendingUrl = null;
  }

  leaveCancel.addEventListener('click', closeLeaveModal);
  leaveOverlay.addEventListener('click', (e) => {
    if (e.target === leaveOverlay) closeLeaveModal();
  });
  leaveContinue.addEventListener('click', () => {
    if (pendingUrl) window.open(pendingUrl, '_blank', 'noopener,noreferrer');
    closeLeaveModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && leaveOverlay.classList.contains('open')) closeLeaveModal();
  });

  // status dot
  const statusColors = {
    online: 'var(--status-online)',
    idle: 'var(--status-idle)',
    dnd: 'var(--status-dnd)',
    offline: 'var(--status-offline)'
  };

  };
  const statusDot = document.getElementById('statusDot');
  const statusTooltip = document.getElementById('statusTooltip');

  function showStatusTooltip(){ statusTooltip.classList.add('visible'); }
  function hideStatusTooltip(){ statusTooltip.classList.remove('visible'); }

  statusDot.addEventListener('mouseenter', showStatusTooltip);
  statusDot.addEventListener('mouseleave', hideStatusTooltip);
  statusDot.addEventListener('focus', showStatusTooltip);
  statusDot.addEventListener('blur', hideStatusTooltip);
  statusDot.addEventListener('touchstart', (e) => {
    e.stopPropagation();
    showStatusTooltip();
  }, { passive: true });
  document.addEventListener('touchstart', (e) => {
    if (e.target !== statusDot) hideStatusTooltip();
  }, { passive: true });

  const statusLabels = {
    online: 'Online',
    idle: 'Idle',
    dnd: 'Do Not Disturb',
    offline: 'Offline'
  };

  function setStatus(status){
    if (status && statusColors[status]) {
      if (statusIcons[status]) {
        statusDot.style.backgroundImage = `url("${statusIcons[status]}")`;
        statusDot.style.backgroundSize = 'cover';
        statusDot.style.backgroundColor = 'var(--bg)';
      } else {
        statusDot.style.backgroundImage = 'none';
        statusDot.style.backgroundColor = statusColors[status];
      }
      statusDot.style.display = 'block';
      statusDot.setAttribute('aria-label', `Discord status: ${statusLabels[status] || status}`);
      const label = statusLabels[status] || status;
      const previewStyle = statusIcons[status]
        ? `background-image:url('${statusIcons[status]}');background-size:cover;`
        : `background:${statusColors[status]};`;
      statusTooltip.innerHTML = `<span class="dot" style="${previewStyle}"></span>${label}`;
    } else {
      statusDot.style.display = 'none';
    }
  }

  setStatus(P.status);

  if (P.discordId) {
    const discordUrl = `https://discord.com/users/${P.discordId}`;
    statusDot.href = discordUrl;
    statusDot.addEventListener('click', (e) => {
      e.preventDefault();
      confirmNavigate(discordUrl);
    });

    async function pollDiscordStatus(){
      try {
        const res = await fetch(`https://api.lanyard.rest/v1/users/${P.discordId}`);
        const json = await res.json();
        if (json && json.success && json.data && json.data.discord_status) {
          setStatus(json.data.discord_status);
        }
      } catch (err) {
        // Lanyard unreachable, or this Discord account hasn't joined
        // the Lanyard server yet — silently fall back to the static status.
      }
    }

    pollDiscordStatus();
    setInterval(pollDiscordStatus, 20000);
  } else {
    statusDot.removeAttribute('href');
  }

  // links
  const linksEl = document.getElementById('linksEl');
  const modalOverlay = document.getElementById('modalOverlay');
  const modalTitle = document.getElementById('modalTitle');
  const modalAccounts = document.getElementById('modalAccounts');
  const modalClose = document.getElementById('modalClose');

  function openAccountModal(link){
    modalTitle.textContent = link.label;
    modalAccounts.innerHTML = '';
    link.accounts.forEach(acc => {
      const a = document.createElement('a');
      a.href = acc.url;
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.className = 'modal-account';
      a.innerHTML = `
        <img src="${acc.avatar}" alt="${acc.name}">
        <span class="modal-account-name">${acc.name}</span>
      `;
      a.addEventListener('click', (e) => {
        e.preventDefault();
        closeAccountModal();
        confirmNavigate(acc.url);
      });
      modalAccounts.appendChild(a);
    });
    modalOverlay.classList.add('open');
  }

  function closeAccountModal(){
    modalOverlay.classList.remove('open');
  }

  modalClose.addEventListener('click', closeAccountModal);
  modalOverlay.addEventListener('click', (e) => {
    if (e.target === modalOverlay) closeAccountModal();
  });
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeAccountModal();
  });

  P.links.forEach((link, i) => {
    if (link.type === 'popup') {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'link-row';
      btn.style.animationDelay = `${0.15 + i * 0.08}s`;
      btn.innerHTML = `
        <span class="link-index">${String(i + 1).padStart(2, '0')}</span>
        <span class="link-label">${link.label}</span>
        <span class="link-arrow">&#8594;</span>
      `;
      btn.addEventListener('click', () => openAccountModal(link));
      btn.addEventListener('animationend', () => { btn.style.animation = 'none'; btn.style.opacity = '1'; });
      linksEl.appendChild(btn);
      return;
    }

    const a = document.createElement('a');
    a.href = link.url;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.className = 'link-row';
    a.style.animationDelay = `${0.15 + i * 0.08}s`;
    a.innerHTML = `
      <span class="link-index">${String(i + 1).padStart(2, '0')}</span>
      <span class="link-label">${link.label}</span>
      <span class="link-arrow">&#8594;</span>
    `;
    a.addEventListener('click', (e) => {
      e.preventDefault();
      confirmNavigate(link.url);
    });
    a.addEventListener('animationend', () => { a.style.animation = 'none'; a.style.opacity = '1'; });
    linksEl.appendChild(a);
  });


  // ---- pointer light: follow cursor/touch with a glow + spark trail ----
  const spotlight = document.getElementById('bgSpotlight');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let lastSparkTime = 0;

  function spawnSpark(x, y){
    const s = document.createElement('div');
    s.className = 'trail-spark';
    s.style.left = x + 'px';
    s.style.top = y + 'px';
    document.body.appendChild(s);
    s.addEventListener('animationend', () => s.remove());
  }

  function handlePointer(x, y){
    spotlight.style.left = x + 'px';
    spotlight.style.top = y + 'px';
    spotlight.classList.add('active');

    if (!reduceMotion) {
      const now = performance.now();
      if (now - lastSparkTime > 55) {
        lastSparkTime = now;
        spawnSpark(x, y);
      }
    }
  }

  window.addEventListener('mousemove', (e) => handlePointer(e.clientX, e.clientY));
  window.addEventListener('mouseleave', () => spotlight.classList.remove('active'));

  window.addEventListener('touchstart', (e) => {
    const t = e.touches[0];
    if (t) handlePointer(t.clientX, t.clientY);
  }, { passive: true });

  window.addEventListener('touchmove', (e) => {
    const t = e.touches[0];
    if (t) handlePointer(t.clientX, t.clientY);
  }, { passive: true });

  window.addEventListener('touchend', () => {
    setTimeout(() => spotlight.classList.remove('active'), 300);
  });
</script>
