<style>
  :root{
    --bg: #0E0F0C;
    --bg-soft: #17190F;
    --surface: #1B1D14;
    --text: #ECE7D8;
    --text-dim: #8B8A7C;
    --accent: #CBA135;
    --accent-dim: #6E602A;
    --ring: #2A2C1F;
    --status-online: #6FA25E;
    --status-idle: #CBA135;
    --status-dnd: #B5533C;
    --status-offline: #55564C;
    --radius: 14px;
  }

  /* ---- light theme override (toggled via data-theme, or system preference) ---- */
  html[data-theme="light"]{
    --bg: #F3EFE3;
    --bg-soft: #E9E3D1;
    --surface: #FFFDF7;
    --text: #262418;
    --text-dim: #746F5C;
    --accent: #A9791E;
    --accent-dim: #C7AE7C;
    --ring: #DCD3B6;
  }

  /* ---- atmosphere background: canvas layer behind everything, music-reactive ---- */
  #atmosphere-bg{
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    z-index: -1;
    pointer-events: none;
    background: var(--bg);
  }


  *{ box-sizing:border-box; }

  html{
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scroll-behavior: smooth;
  }

  @media (prefers-reduced-motion: reduce){
    html{ scroll-behavior: auto; }
  }

  html,body{
    margin:0;
    padding:0;
    min-height:100%;
    width:100%;
    overflow-x:hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 20px;
    background:
      radial-gradient(700px circle at 50% -10%, rgba(203,161,53,0.06), transparent 60%);
  }

  .card{
    width:100%;
    max-width: 420px;
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
  }

  /* ---- avatar ---- */
  .avatar-wrap{
    position:relative;
    width:96px;
    height:96px;
    margin-bottom: 20px;
    opacity:0;
    transition: transform 0.35s cubic-bezier(0.2,0.8,0.2,1);
    animation: avatar-in 0.6s 1.35s cubic-bezier(0.34,1.56,0.64,1) forwards;
  }

  .avatar-wrap:hover{
    transform: scale(1.22) rotate(-2deg);
  }

  /* ---- avatar audio-reactive glow (driven by JS via --glow-scale / --glow-opacity) ---- */
  .avatar-audio-glow{
    position:absolute;
    inset:-34px;
    border-radius:50%;
    background: radial-gradient(circle, color-mix(in srgb, var(--accent) 65%, transparent) 0%, transparent 68%);
    opacity: var(--glow-opacity, 0);
    transform: scale(var(--glow-scale, 0.8));
    pointer-events:none;
    z-index:0;
    transition: opacity 0.12s ease-out;
    will-change: transform, opacity;
  }
  .avatar-ring, .avatar, .avatar-initials, #avatarSlot{ position:relative; z-index:1; }
  .status-dot{ z-index:2; }

  @keyframes beat-pulse{
    0%   { transform: scale(1); }
    30%  { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  .beat-pulse{ animation: beat-pulse 0.35s ease-out; }
  @media (prefers-reduced-motion: reduce){
    .beat-pulse{ animation: none; }
  }

  .avatar-ring{
    position:absolute;
    inset:-6px;
    border-radius:50%;
    border:1.5px solid var(--ring);
    transition: border-color 0.35s ease, box-shadow 0.35s ease;
  }

  .avatar-wrap:hover .avatar-ring{
    border-color: var(--accent-dim);
    box-shadow: 0 0 22px -4px rgba(203,161,53,0.55);
  }

  .avatar-ring::after{
    content:"";
    position:absolute;
    inset:0;
    border-radius:50%;
    border:1.5px solid var(--accent);
    opacity:0;
    animation: pulse-ring 2.8s ease-out infinite;
  }

  .avatar-wrap:hover .avatar-ring::after{
    animation-duration: 1.4s;
  }

  @keyframes pulse-ring{
    0%   { transform:scale(0.94); opacity:0.7; }
    70%  { transform:scale(1.18); opacity:0; }
    100% { transform:scale(1.18); opacity:0; }
  }

  .avatar{
    width:96px;
    height:96px;
    border-radius:50%;
    object-fit:cover;
    display:block;
    background: var(--surface);
    border: 1px solid var(--ring);
    filter: saturate(1) brightness(1);
    transition: filter 0.35s ease;
  }

  .avatar-wrap:hover .avatar{
    filter: saturate(1.15) brightness(1.06);
  }

  .avatar-initials{
    width:96px;
    height:96px;
    border-radius:50%;
    background: var(--surface);
    border: 1px solid var(--ring);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-style:italic;
    font-weight:500;
    font-size: 34px;
    color: var(--accent);
  }

  .status-dot{
    position:absolute;
    right:2px;
    bottom:2px;
    width:16px;
    height:16px;
    border-radius:50%;
    border:3px solid var(--bg);
    cursor:pointer;
    display:block;
    transition: transform 0.2s ease;
  }

  .status-dot:hover{
    transform: scale(1.15);
  }

  .status-tooltip{
    position:absolute;
    bottom: 30px;
    right: -10px;
    display:flex;
    align-items:center;
    gap: 6px;
    background: var(--bg-soft);
    border: 1px solid var(--ring);
    color: var(--text);
    font-family:'JetBrains Mono', monospace;
    font-size: 10.5px;
    letter-spacing: 0.4px;
    padding: 6px 10px;
    border-radius: 8px;
    white-space: nowrap;
    opacity:0;
    transform: translateY(4px);
    pointer-events:none;
    transition: opacity 0.18s ease, transform 0.18s ease;
    box-shadow: 0 8px 18px -8px rgba(0,0,0,0.55);
    z-index: 5;
  }

  .status-tooltip::before{
    content:"";
    position:absolute;
    bottom:-5px;
    right: 16px;
    width:8px;
    height:8px;
    background: var(--bg-soft);
    border-right:1px solid var(--ring);
    border-bottom:1px solid var(--ring);
    transform: rotate(45deg);
  }

  .status-tooltip .dot{
    width:7px;
    height:7px;
    border-radius:50%;
    flex-shrink:0;
  }

  .status-tooltip.visible{
    opacity:1;
    transform: translateY(0);
  }

  /* ---- discord activity card (currently playing / listening) ---- */
  .activity-stack{
    position: fixed;
    left: 20px;
    right: 20px;
    bottom: 20px;
    z-index: 6;
    display:flex;
    justify-content: space-between;
    align-items:flex-end;
    gap: 14px;
    pointer-events:none;
  }

  .activity-card{
    display:flex;
    align-items:center;
    gap: 12px;
    max-width: 280px;
    background: var(--bg-soft);
    border: 1px solid var(--ring);
    border-radius: 12px;
    padding: 12px 14px;
    box-shadow: 0 12px 28px -10px rgba(0,0,0,0.6);
    opacity:0;
    transform: translateY(10px) scale(1);
    pointer-events:none;
    will-change: transform, opacity;
    transition: opacity 0.35s ease, transform 0.4s cubic-bezier(0.16,1,0.3,1), border-color 0.35s ease;
  }

  .activity-card::after{
    content:"";
    position:absolute;
    inset:-1px;
    border-radius: 13px;
    box-shadow: 0 18px 40px -12px rgba(0,0,0,0.7), 0 0 26px -4px rgba(203,161,53,0.35);
    opacity:0;
    pointer-events:none;
    transition: opacity 0.4s cubic-bezier(0.16,1,0.3,1);
  }

  .spotify-card{ transform-origin: bottom left; position:relative; }
  .game-card{ transform-origin: bottom right; position:relative; }

  .activity-card.visible{
    opacity:1;
    transform: translateY(0) scale(1);
    pointer-events:auto;
  }

  .activity-card.visible:hover{
    transform: translateY(-2px) scale(1.5);
    max-width: 300px;
    border-color: var(--accent-dim);
    z-index: 20;
    cursor: default;
  }

  .activity-card.visible:hover::after{
    opacity:1;
  }

  /* Let the text actually unfold instead of just being scaled up while still clipped */
  .activity-card.visible:hover .activity-name,
  .activity-card.visible:hover .activity-detail{
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
  }

  .activity-card.visible:hover .activity-lyric{
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    max-height: 200px;
  }

  @media (max-width: 480px){
    .activity-card.visible:hover{
      transform: translateY(-2px) scale(1.15);
      max-width: 92vw;
    }
  }

  .activity-card.stale{
    opacity:0.68;
  }

  .activity-card.stale .activity-kind{
    color: var(--text-dim);
  }

  .activity-card.stale .activity-art{
    filter: grayscale(0.4);
  }

  .activity-art{
    width: 46px;
    height: 46px;
    border-radius: 8px;
    flex-shrink:0;
    background: var(--surface) center/cover no-repeat;
    border: 1px solid var(--ring);
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--accent-dim);
  }

  .activity-art svg{ width:22px; height:22px; }

  .activity-info{
    min-width:0;
    text-align:left;
  }

  .activity-kind{
    margin:0 0 2px;
    font-family:'JetBrains Mono', monospace;
    font-size: 9.5px;
    letter-spacing: 0.6px;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }

  .activity-name{
    margin:0;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .activity-detail{
    margin: 1px 0 0;
    font-size: 11px;
    color: var(--text-dim);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  .activity-timer{
    margin: 3px 0 0;
    font-family:'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--accent-dim);
  }

  /* ---- live lyric line: pops up under the timer on the Spotify card ---- */
  .activity-lyric{
    position:relative;
    margin: 7px 0 0;
    padding: 7px 0 2px 16px;
    border-top: 1px dashed var(--ring);
    font-family: 'Fraunces', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 12px;
    line-height: 1.4;
    letter-spacing: 0.1px;
    color: var(--text);
    text-shadow: 0 0 14px rgba(203,161,53,0.25);
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    max-height:0;
    opacity:0;
    transform: translateY(4px);
    transition: max-height 0.25s ease, opacity 0.25s ease, transform 0.25s ease, margin 0.25s ease, padding 0.25s ease, border-color 0.25s ease;
  }

  .activity-lyric::before{
    content:"\201C";
    position:absolute;
    left:-2px;
    top:2px;
    font-family:'Fraunces', serif;
    font-style:normal;
    font-weight:600;
    font-size: 20px;
    color: var(--accent);
    line-height:1;
  }

  .activity-lyric.visible{
    max-height: 20px;
    opacity:1;
    transform: translateY(0);
  }

  .activity-lyric.pop{
    animation: lyric-pop 0.35s cubic-bezier(0.2,0.8,0.2,1);
  }

  @keyframes lyric-pop{
    0%{ transform: translateY(6px) scale(0.94); opacity:0.3; }
    60%{ transform: translateY(-1px) scale(1.03); opacity:1; }
    100%{ transform: translateY(0) scale(1); opacity:1; }
  }

  @media (max-width: 480px){
    .activity-stack{
      left: 14px;
      right: 14px;
      bottom: 14px;
      flex-direction: column-reverse;
      align-items: stretch;
      gap: 10px;
    }
    .activity-card{
      max-width: none;
    }
    .spotify-card, .game-card{ transform-origin: bottom center; }
  }

  @media (prefers-reduced-motion: reduce){
    .activity-lyric.pop{ animation:none; }
  }

  /* ---- identity ---- */
  .name{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: 0.2px;
    color: var(--text);
    margin: 0;
    position:relative;
    display:inline-block;
    opacity:0;
    transition: text-shadow 0.4s ease;
    animation: identity-in 0.5s 0.7s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  .name:hover{
    text-shadow: 0 0 18px rgba(203,161,53,0.35);
  }

  .name-underline{
    width: 0%;
    height: 1px;
    background: var(--accent);
    margin: 8px auto 0;
    animation: draw-line 0.9s 1.05s ease-out forwards;
    transition: width 0.3s ease, box-shadow 0.3s ease;
  }

  .name:hover + .name-underline{
    width: 70px;
    box-shadow: 0 0 8px rgba(203,161,53,0.6);
  }

  @keyframes draw-line{
    to{ width: 46px; }
  }

  .handle{
    margin-top: 12px;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    opacity:0;
    animation: identity-in 0.5s 0.78s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  .tagline{
    margin-top: 6px;
    font-size: 12.5px;
    letter-spacing: 0.5px;
    color: var(--accent);
    opacity:0;
    animation: identity-in 0.5s 0.86s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  .bio{
    margin-top: 20px;
    font-size: 13.5px;
    line-height: 1.7;
    color: var(--text-dim);
    max-width: 340px;
    opacity:0;
    animation: identity-in 0.5s 0.94s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  /* ---- divider ---- */
  .divider{
    display:flex;
    align-items:center;
    gap: 10px;
    width:100%;
    max-width: 320px;
    margin: 28px 0 22px;
  }
  .divider .line{ flex:1; height:1px; background: var(--ring); }
  .divider .dot{ width:4px; height:4px; border-radius:50%; background: var(--accent-dim); }

  /* ---- links ---- */
  .links{
    width:100%;
    display:flex;
    flex-direction:column;
    gap: 10px;
  }

  @keyframes link-in{
    from{ opacity:0; transform: translateY(-22px); }
    to{ opacity:1; transform: translateY(0); }
  }

  .link-row{
    opacity:0;
    animation: link-in 0.5s cubic-bezier(0.16,1,0.3,1) forwards;
  }

  @keyframes identity-in{
    from{ opacity:0; transform: translateY(10px); }
    to{ opacity:1; transform: translateY(0); }
  }

  @keyframes avatar-in{
    from{ opacity:0; transform: scale(0.7) translateY(8px); }
    to{ opacity:1; transform: scale(1) translateY(0); }
  }

  .link-row{
    position:relative;
    z-index: 1;
    display:flex;
    align-items:center;
    gap: 14px;
    width:100%;
    padding: 14px 18px;
    background: var(--bg-soft);
    border: 1px solid var(--ring);
    border-radius: var(--radius);
    text-decoration:none;
    color: var(--text);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13.5px;
    letter-spacing: 0.3px;
    overflow:hidden;
    cursor:pointer;
    transition: border-color 0.25s ease, transform 0.15s ease, background 0.25s ease, box-shadow 0.25s ease;
  }

  .link-row::before{
    content:"";
    position:absolute;
    top:0;
    left:-60%;
    width: 40%;
    height:100%;
    background: linear-gradient(120deg, transparent, rgba(203,161,53,0.14), transparent);
    transform: skewX(-20deg);
    transition: left 0.65s ease;
    pointer-events:none;
  }

  .link-row:hover::before{
    left: 130%;
  }

  .link-row:hover{
    border-color: var(--accent-dim);
    background: var(--surface);
    transform: translateY(-3px) scale(1.08);
    box-shadow: 0 12px 26px -10px rgba(0,0,0,0.55), 0 0 24px -6px rgba(203,161,53,0.35), 0 0 0 1px rgba(203,161,53,0.15);
    z-index: 2;
  }

  .link-row:active{ transform: translateY(0); }

  .link-index{
    color: var(--text-dim);
    font-size: 12px;
    min-width: 20px;
    text-align:left;
    transition: color 0.25s ease;
  }

  .link-row:hover .link-index{
    color: var(--accent);
  }

  .link-icon{
    width: 20px;
    height: 20px;
    flex-shrink: 0;
    display:flex;
    align-items:center;
    justify-content:center;
    color: var(--accent-dim);
    transition: transform 0.25s ease, filter 0.25s ease;
    filter: saturate(0.85) brightness(0.92);
  }

  .link-icon svg,
  .link-icon img{ width:100%; height:100%; display:block; object-fit: contain; }

  .link-row:hover .link-icon{
    color: var(--accent);
    transform: scale(1.12) rotate(-4deg);
    filter: saturate(1.1) brightness(1.05);
  }

  .link-label{ flex:1; text-align:left; }

  .link-arrow{
    color: var(--accent);
    opacity:0;
    transform: translateX(-4px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    font-size: 13px;
  }

  .link-row:hover .link-arrow{
    opacity:1;
    transform: translateX(0);
  }

  .link-row:focus-visible{
    outline: 1.5px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---- footer ---- */
  .footer{
    margin-top: 32px;
    font-size: 10.5px;
    letter-spacing: 0.5px;
    color: var(--text-dim);
    opacity: 0.6;
  }

  @media (prefers-reduced-motion: reduce){
    .avatar-ring::after{
      animation: none !important;
    }
  }

  /* ============================================================
     NEW FEATURE BATCH — added on request
     ============================================================ */

  /* ---- loading screen ---- */
  .preloader{
    position:fixed;
    inset:0;
    z-index: 999;
    display:flex;
    align-items:center;
    justify-content:center;
    background: var(--bg);
    transition: opacity 0.5s ease, visibility 0.5s ease;
  }
  .preloader-mark{
    width:44px; height:44px;
    border-radius:50%;
    border: 2px solid var(--ring);
    border-top-color: var(--accent);
    animation: preloader-spin 0.9s linear infinite;
  }
  @keyframes preloader-spin{ to{ transform: rotate(360deg); } }
  .preloader.done{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  @media (prefers-reduced-motion: reduce){
    .preloader-mark{ animation-duration: 1.8s; }
  }

  /* ---- scroll progress bar (only shown when page actually scrolls) ---- */
  .scroll-progress{
    position:fixed;
    top:0; left:0;
    height:3px;
    width:0%;
    background: var(--accent);
    z-index: 500;
    transition: width 0.1s linear, opacity 0.25s ease;
    opacity:0;
    pointer-events:none;
  }
  .scroll-progress.active{ opacity:1; }

  /* ---- theme toggle ---- */
  .theme-toggle{
    position:fixed;
    top: 16px;
    right: 16px;
    z-index: 50;
    width:36px;
    height:36px;
    border-radius:50%;
    background: var(--bg-soft);
    border: 1px solid var(--ring);
    color: var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    overflow:hidden;
    transition: transform 0.2s ease, border-color 0.25s ease, background 0.25s ease;
  }
  .theme-toggle:hover{ transform: translateY(-2px); border-color: var(--accent-dim); }
  .theme-toggle:active{ transform: translateY(0) scale(0.94); }
  .theme-toggle svg{ width:18px; height:18px; }
  .theme-toggle .icon-moon{ display:block; }
  .theme-toggle .icon-sun{ display:none; }
  html[data-theme="light"] .theme-toggle .icon-moon{ display:none; }
  html[data-theme="light"] .theme-toggle .icon-sun{ display:block; }

  /* ---- music widget ---- */
  .music-widget{
    position:fixed;
    top: 16px;
    left: 16px;
    z-index: 50;
    display:flex;
    align-items:center;
    gap: 10px;
  }

  .music-toggle{
    width:36px;
    height:36px;
    flex-shrink:0;
    border-radius:50%;
    background: var(--bg-soft);
    border: 1px solid var(--ring);
    color: var(--accent);
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    overflow:hidden;
    transition: transform 0.2s ease, border-color 0.25s ease, background 0.25s ease;
  }
  .music-toggle:hover{ transform: translateY(-2px); border-color: var(--accent-dim); }
  .music-toggle:active{ transform: translateY(0) scale(0.94); }
  .music-toggle svg{ width:16px; height:16px; }
  .music-toggle .icon-play{ display:block; }
  .music-toggle .icon-pause{ display:none; }
  .music-toggle[aria-pressed="true"] .icon-play{ display:none; }
  .music-toggle[aria-pressed="true"] .icon-pause{ display:block; }

  /* prev/next only reveal once the widget is open, so the collapsed state stays a single button */
  .music-nav{
    width:26px;
    height:26px;
    flex-shrink:0;
    border-radius:50%;
    background: var(--bg-soft);
    border: 1px solid var(--ring);
    color: var(--text-dim);
    display:none;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    opacity:0;

    transition: transform 0.25s cubic-bezier(0.16,1,0.3,1), opacity 0.2s ease, border-color 0.2s ease, color 0.2s ease;

  .music-nav svg{ width:12px; height:12px; }
  .music-nav:hover{ color: var(--accent); border-color: var(--accent-dim); }
  .music-widget.open .music-nav{ display:flex; opacity:1; transform:scale(1); }

  .music-panel{
    display:flex;
    align-items:center;
    gap: 10px;
    max-width: 0;
    padding: 0;
    overflow:hidden;
    opacity:0;
    border-radius: 20px;

  .music-widget.open .music-panel{

    pointer-events:auto;
  }

  .music-panel .equalizer{ margin-left:0; flex-shrink:0; }
  /* real audio data drives these bars via JS, so the generic CSS bounce is disabled here */
  #musicEq span{ animation: none !important; height: 3px; transition: height 0.08s linear; }

    flex-direction:column;

  .music-playlist{

  .playlist-text{ min-width:0; display:flex; flex-direction:column; line-height:1.25; }
  .playlist-title{ font-size:12px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

  .music-volume{

  /* ---- UAE clock widget ---- */
  .clock-widget{

  /* ---- glassmorphism for cards ---- */
  .link-row, .activity-card, .modal-box{
    background: color-mix(in srgb, var(--bg-soft) 78%, transparent);
    backdrop-filter: blur(10px) saturate(1.1);

  /* ---- animated gradient border around the main card ---- */
  .card{
    position:relative;
    padding: 22px 18px;
    border-radius: 18px;
  }
  .card::before{
    content:"";
    position:absolute;
    inset:0;
    border-radius: 18px;
    padding:1px;
    background: conic-gradient(from var(--border-angle,0deg), var(--accent-dim), transparent 30%, var(--accent) 50%, transparent 70%, var(--accent-dim));
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);

    50%{ opacity:1; }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-godray{ display:none; }
    .dust{ display:none; }
    .bg-vignette{ animation:none; }
    .parallax{ transition:none; }
  }

  /* ---- pointer light: cursor/touch glow + trailing sparks ---- */
  .bg-spotlight{
    position:fixed;
    width:260px;
    height:260px;
    left:0;
    top:0;
    margin-left:-130px;
    margin-top:-130px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(203,161,53,0.13), rgba(203,161,53,0.04) 45%, transparent 72%);
    pointer-events:none;
    z-index:0;
    opacity:0;
    mix-blend-mode: screen;
    transition: left 0.16s ease-out, top 0.16s ease-out, opacity 0.4s ease;
  }

  .bg-spotlight.active{ opacity:1; }

  .trail-spark{
    position:fixed;
    width:5px;
    height:5px;
    border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 10px 2px rgba(203,161,53,0.55);
    pointer-events:none;
    z-index:0;
    opacity:0.75;
    transform: translate(-50%,-50%);
    animation: spark-fade 0.9s ease-out forwards;
  }

  @keyframes spark-fade{
    to{ opacity:0; transform: translate(-50%,-50%) scale(0.25); }
  }

  @media (prefers-reduced-motion: reduce){
    .bg-spotlight{ transition: opacity 0.4s ease; }
    .trail-spark{ display:none; }
  }
  @media (max-width: 360px){
    .name{ font-size: 26px; }
    .avatar-wrap{ width:84px; height:84px; }
    .avatar, .avatar-initials{ width:84px; height:84px; }
  }

  /* ---- full-width audio-reactive waveform pinned to the bottom of the viewport ---- */
  #audioWaveform{
    position:fixed;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    height:64px;
    pointer-events:none;
    z-index: 40;
    opacity:0;
    transition: opacity 0.4s ease;
  }
  #audioWaveform.active{ opacity:0.85; }
  @media (max-width: 480px){
    #audioWaveform{ height:44px; }
  }

  /* ---- entry gate: click-to-open overlay shown before the page/audio starts ---- */
  .entry-gate{
    position:fixed;
    inset:0;
    z-index: 500;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 20px;
    background: var(--bg);
    transition: opacity 0.45s ease;
  }
  .entry-gate.closed{
    opacity:0;
    pointer-events:none;
  }
  .entry-gate-inner{
    display:flex;
    flex-direction:column;
    align-items:center;
    text-align:center;
    gap:14px;
    max-width: 320px;
  }
  .entry-gate-btn{
    font-family:'Fraunces', serif;
    font-style: italic;
    font-weight: 600;
    font-size: 19px;
    color: var(--text);
    background: var(--surface);
    border: 1.5px solid var(--accent);
    border-radius: var(--radius);
    padding: 16px 34px;
    cursor: pointer;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .entry-gate-btn:hover{
    transform: translateY(-2px);
    border-color: var(--accent-dim);
  }
  .entry-gate-btn:active{
    transform: translateY(0) scale(0.96);
  }
  .entry-gate-warning{
    font-family:'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.3px;
    color: var(--text-dim);
    margin:0;
  }
  .entry-gate-mute{
    display:flex;
    align-items:center;
    gap:6px;
    font-family:'JetBrains Mono', monospace;
    font-size: 11.5px;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--accent-dim);
    border-radius: 999px;
    padding: 7px 14px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  .entry-gate-mute:hover{ border-color: var(--accent); color: var(--text); }
  .entry-gate-mute[aria-pressed="false"]{ color: var(--text-dim); opacity: 0.7; }
</style>
</head>

  const statusDot = document.getElementById('statusDot');

  statusDot.addEventListener('mouseleave', hideStatusTooltip);
  statusDot.addEventListener('focus', showStatusTooltip);

    showStatusTooltip();

  document.addEventListener('touchstart', (e) => {

      statusDot.setAttribute('aria-label', `Discord status: ${statusLabels[status] || status}`);
      const label = statusLabels[status] || status;
      const previewStyle = statusIcons[status]
        ? `background-image:url('${statusIcons[status]}');background-size:cover;`
        : `background:${statusColors[status]};`;
      statusTooltip.innerHTML = `<span class="dot" style="${previewStyle}"></span>${label}`;
    } else {
      statusDot.style.display = 'none';
    }
  }

  setStatus(P.status);

    // ---- currently playing / listening cards, driven by the same Lanyard payload ----
    // Spotify gets its own card (left); any other running activity (game/app) gets its own (right) —

    function cardRefs(prefix){
      return {
        card: document.getElementById(prefix === 'spotify' ? 'spotifyCard' : 'activityCard'),
        art: document.getElementById(prefix + 'Art'),
        kind: document.getElementById(prefix === 'spotify' ? 'spotifyKindText' : prefix + 'Kind'),

    const spotifyEls = cardRefs('spotify');

    const defaultArtHTML = gameEls.art.innerHTML; // fallback note icon, restored when there's no art
    let spotifyTimer = null;
    let gameTimer = null;
    const LAST_ACTIVITY_KEY = 'lastDiscordActivity';

    const activityKindLabels = { 0: 'Playing', 1: 'Streaming', 2: 'Listening to', 3: 'Watching', 5: 'Competing in' };

    function discordAssetUrl(applicationId, image){
      if (!image) return null;
      if (image.startsWith('mp:')) return `https://media.discordapp.net/${image.slice(3)}`;
      if (image.startsWith('spotify:')) return `https://i.scdn.co/image/${image.slice(8)}`;
      return `https://cdn.discordapp.com/app-assets/${applicationId}/${image}.png`;
    }

    function formatElapsed(startMs){
      const secs = Math.max(0, Math.floor((Date.now() - startMs) / 1000));
      const h = Math.floor(secs / 3600);
      const m = Math.floor((secs % 3600) / 60);
      const s = secs % 60;
      const pad = n => String(n).padStart(2, '0');
      return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
    }

    function formatAgo(thenMs){
      const secs = Math.max(0, Math.floor((Date.now() - thenMs) / 1000));
      if (secs < 60) return 'just now';
      const m = Math.floor(secs / 60);
      if (m < 60) return `${m}m ago`;
      const h = Math.floor(m / 60);
      if (h < 24) return `${h}h ago`;
      const d = Math.floor(h / 24);
      return `${d}d ago`;
    }

    // Lanyard only reports live state — so the "last activity" is whatever we
    // last saw ourselves. Cache it locally each time something real comes in.
    function cacheLastActivity(info){

      } catch (err) { /* storage unavailable (private browsing etc) — just skip caching */ }
    }

    function loadLastActivity(){

      } catch (err) { return null; }

    // ---- Spotify card + live synced lyrics (lrclib.net) ----
    let lyricsTrackKey = null;
    let lyricsData = null;
    let lyricLineTimer = null;

    function parseLRC(lrc){
      const lines = [];
      const re = /\[(\d{2}):(\d{2}(?:\.\d{1,3})?)\]/g;
      lrc.split('\n').forEach(line => {
        const matches = [...line.matchAll(re)];
        if (!matches.length) return;
        const text = line.replace(re, '').trim();
        matches.forEach(m => {
          const time = parseInt(m[1], 10) * 60 + parseFloat(m[2]);
          lines.push({ time, text });
        });
      });
      lines.sort((a, b) => a.time - b.time);
      return lines;
    }

    async function fetchSyncedLyrics(track, artist, album, durationSec){
      try {
        const params = new URLSearchParams({ track_name: track, artist_name: artist });
        if (album) params.set('album_name', album);
        if (durationSec) params.set('duration', String(Math.round(durationSec)));
        const res = await fetch(`https://lrclib.net/api/get?${params.toString()}`);
        if (!res.ok) return null;
        const data = await res.json();
        return data.syncedLyrics ? parseLRC(data.syncedLyrics) : null;
      } catch (err) {
        return null; // no network / no match — lyric line just stays hidden
      }
    }

    function setLyricLine(text){
      if (text) {
        spotifyLyricEl.textContent = text;
        spotifyLyricEl.classList.remove('pop');
        void spotifyLyricEl.offsetWidth; // restart the pop animation
        spotifyLyricEl.classList.add('pop', 'visible');
      } else {
        spotifyLyricEl.classList.remove('visible');
      }
    }

    function tickLyrics(startMs){
      if (!lyricsData || !startMs) return;
      const elapsed = (Date.now() - startMs) / 1000;
      const lines = lyricsData.lines;
      let idx = -1;
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].time <= elapsed) idx = i; else break;
      }
      if (idx !== lyricsData.lastIndex) {
        lyricsData.lastIndex = idx;
        setLyricLine(idx >= 0 ? lines[idx].text : '');
      }
    }

    function stopLyrics(){
      if (lyricLineTimer) { clearInterval(lyricLineTimer); lyricLineTimer = null; }
      lyricsData = null;
      lyricsTrackKey = null;
      spotifyLyricEl.classList.remove('visible', 'pop');
      spotifyLyricEl.textContent = '';
    }

    function startLyricsFor(sp){
      const key = `${sp.song}::${sp.artist}`;
      if (key === lyricsTrackKey) return; // already tracking this track, let the interval keep ticking
      lyricsTrackKey = key;
      lyricsData = null;
      if (lyricLineTimer) { clearInterval(lyricLineTimer); lyricLineTimer = null; }
      spotifyLyricEl.classList.remove('visible', 'pop');
      spotifyLyricEl.textContent = '';

      const startMs = sp.timestamps && sp.timestamps.start;
      const endMs = sp.timestamps && sp.timestamps.end;

      if (!d) return;

      if (spotifyLive) {
        showLiveSpotify(d.spotify);
      } else {
        hideSpotifyCard();

      // Any other running activity (game/app) that isn't the Spotify entry or a bare custom-status (type 4).
      const activities = Array.isArray(d.activities) ? d.activities : [];
      const otherActivity = activities.find(a => a.type !== 4 && a.name !== 'Spotify');

      if (otherActivity) {
        showLiveGame({
          kindLabel: activityKindLabels[otherActivity.type] || 'Playing',
          name: otherActivity.name || '',

          artUrl: discordAssetUrl(otherActivity.application_id, otherActivity.assets && otherActivity.assets.large_image),
          start: otherActivity.timestamps && otherActivity.timestamps.start

        hideGameCard();

    let lanyardSocket = null;
    let heartbeatTimer = null;
    let reconnectDelay = 2000;

    function connectLanyard(){
      try {
        lanyardSocket = new WebSocket('wss://api.lanyard.rest/socket');
      } catch (err) {
        scheduleReconnect();
        return;
      }

      lanyardSocket.addEventListener('open', () => {
        lanyardSocket.send(JSON.stringify({
          op: 2,
          d: { subscribe_to_id: P.discordId }
        }));
      });

      lanyardSocket.addEventListener('message', (event) => {
        let msg;
        try { msg = JSON.parse(event.data); } catch (e) { return; }

        // op 1 = Hello — server tells us how often to heartbeat
        if (msg.op === 1 && msg.d && msg.d.heartbeat_interval) {
          if (heartbeatTimer) clearInterval(heartbeatTimer);
          heartbeatTimer = setInterval(() => {
            if (lanyardSocket && lanyardSocket.readyState === WebSocket.OPEN) {
              lanyardSocket.send(JSON.stringify({ op: 3 }));
            }
          }, msg.d.heartbeat_interval);
          reconnectDelay = 2000; // connection is healthy, reset backoff
        }

        // op 0 = Event — initial state or a live presence update
        if (msg.op === 0 && msg.d && msg.d.discord_status) {
          setStatus(msg.d.discord_status);
          if (msg.d.discord_status === 'offline') showLastActivity();
          else updateActivity(msg.d);
        }
      });

      lanyardSocket.addEventListener('close', scheduleReconnect);
      lanyardSocket.addEventListener('error', () => {
        if (lanyardSocket) lanyardSocket.close();
      });
    }

    function scheduleReconnect(){
      if (heartbeatTimer) { clearInterval(heartbeatTimer); heartbeatTimer = null; }
      setTimeout(connectLanyard, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 1.5, 30000); // back off up to 30s

        const json = await res.json();
        if (json && json.success && json.data && json.data.discord_status) {
          setStatus(json.data.discord_status);
          if (json.data.discord_status === 'offline') showLastActivity();
          else updateActivity(json.data);
        } else {
          clearStuckSkeletons();
        }
      } catch (err) {
        // Lanyard unreachable, or this Discord account hasn't joined
        // the Lanyard server yet — fall back to the static status instead
        // of leaving a skeleton on screen forever.
        clearStuckSkeletons();
      }
    }

    spotifyEls.card.classList.add('visible', 'skeleton');
    gameEls.card.classList.add('visible', 'skeleton');

  function spawnSpark(x, y){
    const s = document.createElement('div');
    s.className = 'trail-spark';

  // ---- parallax: bg motifs drift on their own (idle wander) and blend in pointer offset —
  // this is what keeps the scene moving even when nobody's touched the mouse.
  const parallaxEls = document.querySelectorAll('.parallax');
  let pointerDX = 0, pointerDY = 0;
  const parallaxStart = performance.now();

  function parallaxLoop(){
    const t = (performance.now() - parallaxStart) / 1000;
    const idleDX = Math.sin(t * 0.15) * 26 + Math.sin(t * 0.07 + 1.3) * 14;
    const idleDY = Math.cos(t * 0.12) * 16 + Math.sin(t * 0.05 + 0.6) * 10;
    const dx = idleDX + pointerDX;
    const dy = idleDY + pointerDY;
    parallaxEls.forEach(el => {
      const depth = parseFloat(el.dataset.depth) || 0;
      el.style.transform = `translate(${(dx * depth).toFixed(1)}px, ${(dy * depth).toFixed(1)}px)`;
    });
    requestAnimationFrame(parallaxLoop);
  }

  function setPointerOffset(x, y){
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    pointerDX = x - cx;
    pointerDY = y - cy;

    try {

    function loadTrack(i, autoplay){

    function sizeWaveformCanvas(){

      for (let i = 0; i < bassEnd; i++) bassSum += freqData[i];

      // Small equalizer bars in the music widget — each bar samples a slice of the spectrum.
      const bands = eqBars.length;
      for (let b = 0; b < bands; b++) {
        const start = Math.floor((b / bands) * len * 0.55);
        const end = Math.floor(((b + 1) / bands) * len * 0.55);
        let sum = 0;
        for (let i = start; i < end; i++) sum += freqData[i];
        const avg = sum / Math.max(1, end - start) / 255;

      if (waveCtx) {

        const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#CBA135';
        waveCtx.fillStyle = accent;
        for (let i = 0; i < barCount; i++) {

          const barH = Math.max(2, v * h);

      bassAvg = bassAvg * 0.92 + bassLevel * 0.08;
      const now = performance.now();
      if (bassLevel > bassAvg * 1.35 && bassLevel > 0.35 && now - lastBeatAt > 260) {
        lastBeatAt = now;
        [avatarWrap, nameEl].forEach(el => {
          if (!el) return;
          el.classList.remove('beat-pulse');
          void el.offsetWidth; // restart animation
          el.classList.add('beat-pulse');
        });
      }
    }
    requestAnimationFrame(frame);
  })();

  // ---- entry gate: click-to-open overlay; starts background music once dismissed ----
  (function initEntryGate(){
    const gate = document.getElementById('entryGate');
    const btn = document.getElementById('entryGateBtn');
    const muteBtn = document.getElementById('entryGateMuteBtn');
    if (!gate || !btn) return;

    document.body.style.overflow = 'hidden';
    let wantsMusic = true;

    if (muteBtn) {
      const icon = muteBtn.querySelector('.entry-gate-mute-icon');
      const label = muteBtn.querySelector('.entry-gate-mute-label');
      muteBtn.addEventListener('click', () => {
        wantsMusic = !wantsMusic;
        muteBtn.setAttribute('aria-pressed', wantsMusic ? 'true' : 'false');
        if (icon) icon.textContent = wantsMusic ? '🔊' : '🔇';
        if (label) label.textContent = wantsMusic ? 'Music on' : 'Music off';
      });
    }

    btn.addEventListener('click', () => {
      if (wantsMusic && typeof window.__startBgMusic === 'function') window.__startBgMusic();
      gate.classList.add('closed');
      document.body.style.overflow = '';
      gate.addEventListener('transitionend', () => gate.remove(), { once: true });
    });
  })();

  // ---- scroll progress bar (only visible if the page is actually taller than the viewport) ----
  (function initScrollProgress(){
    const bar = document.getElementById('scrollProgress');
    if (!bar) return;
    function update(){
      const scrollable = document.documentElement.scrollHeight - window.innerHeight;
      if (scrollable <= 4) { bar.classList.remove('active'); bar.style.width = '0%'; return; }
      bar.classList.add('active');
      const pct = (window.scrollY / scrollable) * 100;
      bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
    }
    window.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    update();
  })();

  // ---- dark/light theme: auto-detect system preference, remember explicit choice ----
  (function initTheme(){
    const KEY = 'sitePreferredTheme';
    const root = document.documentElement;
    const toggle = document.getElementById('themeToggle');
    const media = window.matchMedia('(prefers-color-scheme: light)');

    function apply(theme){
      if (theme === 'light') root.setAttribute('data-theme', 'light');
      else root.removeAttribute('data-theme');
    }

    let saved = null;
    try { saved = localStorage.getItem(KEY); } catch (err) {}

    if (saved === 'light' || saved === 'dark') {
      apply(saved);
    } else {
      apply(media.matches ? 'light' : 'dark');
    }

    // if the user hasn't explicitly chosen, keep following the system
    media.addEventListener('change', (e) => {
      let current = null;
      try { current = localStorage.getItem(KEY); } catch (err) {}
      if (current !== 'light' && current !== 'dark') apply(e.matches ? 'light' : 'dark');
    });

    if (toggle) {
      toggle.addEventListener('click', () => {
        const isLight = root.getAttribute('data-theme') === 'light';
        const next = isLight ? 'dark' : 'light';
        apply(next);
        try { localStorage.setItem(KEY, next); } catch (err) {}
        if (navigator.vibrate) navigator.vibrate(6);
      });
    }
  })();

  // ---- copy Discord username ----
  (function initCopyHandle(){
    const btn = document.getElementById('copyHandleBtn');
    const toast = document.getElementById('copyToast');
    if (!btn) return;
    btn.addEventListener('click', async () => {
      const text = (window.PROFILE && window.PROFILE.handle) || '';
      try {
        await navigator.clipboard.writeText(text);
      } catch (err) {
        // clipboard API unavailable — fall back to a hidden textarea select+copy
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        try { document.execCommand('copy'); } catch (e2) {}
        document.body.removeChild(ta);
      }
      if (navigator.vibrate) navigator.vibrate(8);
      if (toast) {
        toast.classList.add('visible');
        clearTimeout(toast._hideTimer);
        toast._hideTimer = setTimeout(() => toast.classList.remove('visible'), 1400);
      }
    });
  })();

  // ---- UAE (Asia/Dubai) live clock ----
  (function initClock(){
    const el = document.getElementById('clockTime');
    if (!el) return;
    const fmt = new Intl.DateTimeFormat('en-GB', {
      timeZone: 'Asia/Dubai', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false
    });
    function tick(){ el.textContent = fmt.format(new Date()); }
    tick();
    setInterval(tick, 1000);
  })();

  // ---- mouse tilt effect on the main card (desktop / fine-pointer only) ----
  (function initTilt(){
    const card = document.querySelector('.card');
    if (!card || reduceMotion || !window.matchMedia('(pointer: fine)').matches) return;
    card.addEventListener('mousemove', (e) => {
      const rect = card.getBoundingClientRect();
      const px = (e.clientX - rect.left) / rect.width - 0.5;
      const py = (e.clientY - rect.top) / rect.height - 0.5;
      card.style.transform = `perspective(1200px) rotateY(${px * 6}deg) rotateX(${-py * 6}deg)`;
    });
    card.addEventListener('mouseleave', () => {
      card.style.transform = 'perspective(1200px) rotateY(0deg) rotateX(0deg)';
    });
  })();

  // ---- ripple click effect + light haptic feedback on interactive elements ----
  (function initRippleAndHaptics(){
    function addRipple(e){
      const target = e.currentTarget;
      const rect = target.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height) * 1.2;
      const span = document.createElement('span');
      span.className = 'ripple';
      const x = (e.clientX !== undefined ? e.clientX : rect.left + rect.width / 2) - rect.left - size / 2;
      const y = (e.clientY !== undefined ? e.clientY : rect.top + rect.height / 2) - rect.top - size / 2;
      span.style.width = span.style.height = size + 'px';
      span.style.left = x + 'px';
      span.style.top = y + 'px';
      const prevPosition = getComputedStyle(target).position;
      if (prevPosition === 'static') target.style.position = 'relative';
      target.appendChild(span);
      span.addEventListener('animationend', () => span.remove());
      if (navigator.vibrate) navigator.vibrate(6);
    }
    // delegate so it also picks up link-rows created dynamically above
    document.addEventListener('click', (e) => {
      const el = e.target.closest('.link-row, .project-card, .theme-toggle, .music-toggle, .leave-btn, .modal-close');
      if (el) addRipple({ currentTarget: el, clientX: e.clientX, clientY: e.clientY });
    });
  })();

  // ---- atmosphere background: runes + threads + embers, synced to the music above ----
  // Original artwork only (no copyrighted characters/logos/game assets).
  (function initAtmosphere(){
    const canvas = document.getElementById('atmosphere-bg');
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const dpr = Math.min(window.devicePixelRatio || 1, 2);

    let W = 0, H = 0;
    function resize(){
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = W * dpr; canvas.height = H * dpr;
      canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function accentRGB(){
      const hex = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#CBA135';
      const n = parseInt(hex.replace('#',''), 16);
      return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
    }

    let bass = 0, mid = 0, treble = 0, beatPulse = 0;
    let lastBassEnergy = 0, bassHistory = [];
    function readAudio(){
      const hook = window.__bgAudioReactive;
      if (!hook || !hook.isPlaying()) { bass *= 0.9; mid *= 0.9; treble *= 0.9; return; }
      const freqData = hook.getFreqData();
      if (!freqData) return;
      const n = freqData.length;
      const bassEnd = Math.floor(n * 0.12), midEnd = Math.floor(n * 0.5);
      let b = 0, m = 0, t = 0, i;
      for (i = 0; i < bassEnd; i++) b += freqData[i];
      for (i = bassEnd; i < midEnd; i++) m += freqData[i];
      for (i = midEnd; i < n; i++) t += freqData[i];
      b = b / bassEnd / 255; m = m / (midEnd - bassEnd) / 255; t = t / (n - midEnd) / 255;
      bass += (b - bass) * 0.35; mid += (m - mid) * 0.25; treble += (t - treble) * 0.2;
      bassHistory.push(b); if (bassHistory.length > 30) bassHistory.shift();
      const avg = bassHistory.reduce((a,v)=>a+v,0) / bassHistory.length;
      if (b > avg * 1.35 && b > 0.25 && b > lastBassEnergy) beatPulse = 1;
      lastBassEnergy = b;
    }

    const RUNES = ['\u16DF','\u1666','\u16B1','\u16A8','\u16B7']; // ᛟ ᚦ ᚱ ᚨ ᚷ — echoes the page's own mark
    let runeNodes = [];
    function initRunes(){
      runeNodes = [];
      const count = Math.max(5, Math.min(9, Math.floor((W*H)/140000)));
      for (let i = 0; i < count; i++){
        runeNodes.push({
          glyph: RUNES[i % RUNES.length],
          x: Math.random()*W, y: Math.random()*H,
          size: 40 + Math.random()*70,
          baseAlpha: 0.03 + Math.random()*0.05,
          drift: (Math.random()-0.5)*0.05,
          phase: Math.random()*Math.PI*2
        });
      }
    }

    let threadNodes = [];
    const THREAD_DIST = 170;
    function initThreads(){
      threadNodes = [];
      const count = Math.max(10, Math.min(22, Math.floor((W*H)/60000)));
      for (let i = 0; i < count; i++){
        threadNodes.push({ x: Math.random()*W, y: Math.random()*H, vx: (Math.random()-0.5)*0.08, vy: (Math.random()-0.5)*0.08 });
      }
    }

    let particles = [];
    function makeParticle(randomY){
      return {
        x: Math.random()*W, y: randomY ? Math.random()*H : H + 20,
        r: 0.8 + Math.random()*1.8,
        speed: 0.15 + Math.random()*0.35,
        sway: Math.random()*Math.PI*2,
        swaySpeed: 0.005 + Math.random()*0.01,
        warm: Math.random() < 0.55,
        alpha: 0.15 + Math.random()*0.35
      };
    }
    function initParticles(){
      particles = [];
      const count = Math.max(30, Math.min(70, Math.floor((W*H)/22000)));
      for (let i = 0; i < count; i++) particles.push(makeParticle(true));
    }

    // ---- seamless scrolling tile layer: faint diagonal hatching + a rune, drawn behind everything ----
    let tilePattern = null, tileSize = 140;
    function buildTile(){
      const tile = document.createElement('canvas');
      tile.width = tileSize; tile.height = tileSize;
      const tctx = tile.getContext('2d');
      tctx.strokeStyle = 'rgba(200,205,195,0.05)';
      tctx.lineWidth = 1;
      for (let x = -tileSize; x < tileSize * 2; x += 20){
        tctx.beginPath();
        tctx.moveTo(x, 0);
        tctx.lineTo(x + tileSize, tileSize);
        tctx.stroke();
      }
      const [ar, ag, ab] = accentRGB();
      tctx.font = '26px serif';
      tctx.fillStyle = `rgba(${ar},${ag},${ab},0.05)`;
      tctx.textAlign = 'center'; tctx.textBaseline = 'middle';
      tctx.fillText(RUNES[Math.floor(Math.random()*RUNES.length)], tileSize/2, tileSize/2);
      tilePattern = ctx.createPattern(tile, 'repeat');
    }
    let scrollX = 0, scrollY = 0;
    function drawScrollLayer(){
      if (!tilePattern) return;
      scrollX = (scrollX + 0.12 + bass*0.5 + beatPulse*1.2) % tileSize;
      scrollY = (scrollY + 0.06 + mid*0.3) % tileSize;
      ctx.save();
      ctx.translate(-scrollX, -scrollY);
      ctx.fillStyle = tilePattern;
      ctx.fillRect(0, 0, W + tileSize, H + tileSize);
      ctx.restore();
    }

    let scrollT = 0;
    function drawFrame(time){
      ctx.clearRect(0, 0, W, H);
      const [ar, ag, ab] = accentRGB();

      const pulseScale = 1 + beatPulse*0.06 + bass*0.05;
      const shakeAmt = reduceMotion ? 0 : beatPulse*4 + mid*2;
      const shakeX = shakeAmt ? (Math.random()-0.5)*shakeAmt : 0;
      const shakeY = shakeAmt ? (Math.random()-0.5)*shakeAmt : 0;

      ctx.save();
      ctx.translate(W/2 + shakeX, H/2 + shakeY);
      ctx.scale(pulseScale, pulseScale);
      ctx.translate(-W/2, -H/2);

      drawScrollLayer();

      for (const rn of runeNodes){
        rn.y += rn.drift*(reduceMotion?0.3:1) - scrollT*0.02;
        if (rn.y < -100) rn.y = H + 100;
        if (rn.y > H + 100) rn.y = -100;
        const alpha = rn.baseAlpha + bass*0.12 + beatPulse*0.1;
        ctx.save();
        ctx.translate(rn.x, ((rn.y % (H+200)) + H + 200) % (H+200) - 100);
        ctx.rotate(Math.sin(time*0.00005 + rn.phase)*0.15);
        ctx.font = rn.size + 'px serif';
        ctx.fillStyle = `rgba(${ar},${ag},${ab},${alpha.toFixed(3)})`;
        ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(rn.glyph, 0, 0);
        ctx.restore();
      }

      for (let t = 0; t < threadNodes.length; t++){
        const n = threadNodes[t];
        n.x += n.vx + (reduceMotion ? 0 : Math.sin(time*0.0003 + t)*0.02);
        n.y += n.vy - scrollT*0.015;
        if (n.x < 0) n.x = W; if (n.x > W) n.x = 0;
        if (n.y < -50) n.y = H + 50; if (n.y > H + 50) n.y = -50;
      }
      ctx.lineWidth = 0.6;
      for (let a = 0; a < threadNodes.length; a++){
        for (let b = a+1; b < threadNodes.length; b++){
          const dx = threadNodes[a].x - threadNodes[b].x, dy = threadNodes[a].y - threadNodes[b].y;
          const dist = Math.sqrt(dx*dx + dy*dy);
          if (dist < THREAD_DIST){
            const lineAlpha = (1 - dist/THREAD_DIST) * (0.08 + treble*0.25 + beatPulse*0.15);
            ctx.strokeStyle = `rgba(200,210,220,${lineAlpha.toFixed(3)})`;
            ctx.beginPath();
            ctx.moveTo(threadNodes[a].x, threadNodes[a].y);
            ctx.lineTo(threadNodes[b].x, threadNodes[b].y);
            ctx.stroke();
          }
        }
      }

      for (let p = 0; p < particles.length; p++){
        const pt = particles[p];
        pt.sway += pt.swaySpeed;
        pt.y -= pt.speed * (1 + mid*2.2 + beatPulse*1.5);
        pt.x += Math.sin(pt.sway)*0.4;
        if (pt.y < -20){ particles[p] = makeParticle(false); continue; }
        const col = pt.warm ? `${ar},${ag},${ab}` : '160,200,190';
        ctx.beginPath();
        ctx.fillStyle = `rgba(${col},${(pt.alpha + beatPulse*0.2).toFixed(3)})`;
        ctx.arc(pt.x, pt.y, pt.r + beatPulse*0.8, 0, Math.PI*2);
        ctx.fill();
      }

      ctx.restore();
      beatPulse *= 0.88;
      scrollT += 0.02;
    }

    let running = true;
    document.addEventListener('visibilitychange', () => { running = !document.hidden; });

    // ---- drive the bottom mountain scroll directly, speeding up on bass/beat ----
    const mountainsTrack = document.getElementById('mountainsTrack');
    let mountainOffset = 0; // percent, wraps 0..50 (50% = exactly one tile width)
    function updateMountainSpeed(){
      if (!mountainsTrack) return;
      const speed = reduceMotion
        ? 0.02 // steady, no beat-driven speed jumps for reduced-motion users
        : 0.028 + bass * 0.09 + beatPulse * 0.08;
      mountainOffset = (mountainOffset + speed) % 50;
      mountainsTrack.style.transform = `translateX(${(-mountainOffset).toFixed(2)}%)`;
    }

    function loop(time){
      if (running){ readAudio(); drawFrame(time); updateMountainSpeed(); }
      requestAnimationFrame(loop);
    }

    resize();
    initRunes(); initThreads(); initParticles(); buildTile();
    window.addEventListener('resize', () => { resize(); initRunes(); initThreads(); initParticles(); buildTile(); });
    requestAnimationFrame(loop);
  })();
</script>
